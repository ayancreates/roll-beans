<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>Menu</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }
    .header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(18, 18, 18, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid #2a2a2a;
    }
    .header span {
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }
    .menu-container {
      width: 100%;
      max-width: 650px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .menu-page {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transform: translateZ(0);
      will-change: transform;
    }
  </style>
</head>
<body>

  <header class="header">
    <span>☕ Our Menu</span>
  </header>

  <main class="menu-container">
    <img src="page-01.jpg" alt="Menu Page 1" class="menu-page" loading="eager" fetchpriority="high">
    <img src="page-02.jpg" alt="Menu Page 2" class="menu-page" loading="lazy">
    <img src="page-03.jpg" alt="Menu Page 3" class="menu-page" loading="lazy">
    <img src="page-04.jpg" alt="Menu Page 4" class="menu-page" loading="lazy">
  </main>

</body>
</html>
